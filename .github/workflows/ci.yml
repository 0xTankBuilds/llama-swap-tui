# CI: vet, build, and test every pull request (and every push to master,
# so a direct push or merge is checked the same way a PR is).
name: CI

"on":
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        # Fail if any Go file is not gofmt-clean. The pre-existing drift
        # was reformatted in the same PR that added this step, so the
        # tree is clean from here on.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean (run gofmt -w on them):" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        # -v so the log lists every test by name (without it, `go test`
        # only prints one summary line per package).
        run: go test -v ./...

  smoke:
    # Boot the real binary against the mock llama-swap server and prove it
    # renders, stays connected, switches tabs, and quits cleanly. Runs in
    # parallel with the test job; see scripts/smoke-test.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tmux
        # The TUI needs a real TTY; install explicitly rather than relying
        # on the runner image shipping tmux.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Smoke test
        run: bash scripts/smoke-test.sh

  lint:
    # golangci-lint (default set, see .golangci.yml). Separate job so it
    # runs in parallel with the test and smoke jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
