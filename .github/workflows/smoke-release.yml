name: smoke-release

# After a release is published, download the Linux amd64 asset and boot it
# against the mock server, asserting the header shows the release tag.
# This validates the packaged artifact, not just a local build.
# If the smoke test fails, the rollback job marks the release as a
# pre-release so it stops being the latest release, and opens a tracking
# issue. The tag and artifacts stay in place; the fix ships as a new
# release, never by re-publishing the failed tag.
"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tmux
        # The TUI needs a real TTY; install explicitly rather than relying
        # on the runner image shipping tmux.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Download Linux release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/smoke-asset
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "*_linux_amd64.tar.gz" --dir /tmp/smoke-asset
          tar xzf /tmp/smoke-asset/*_linux_amd64.tar.gz -C /tmp/smoke-asset
      - name: Smoke test release binary
        run: bash scripts/smoke-test.sh --binary /tmp/smoke-asset/llama-swap-tui --expect-version "${{ github.event.release.tag_name }}"

  # Rollback: runs only when the smoke job fails. Marking the release as a
  # pre-release moves the "latest release" pointer back to the previous
  # stable release. An edit does not re-trigger this workflow, it only
  # listens for published events, so there is no loop. The issue step runs
  # even if the edit fails, so a failure to roll back is still recorded.
  rollback:
    name: Roll back release on smoke failure
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Mark release as pre-release
        id: mark
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.event.release.tag_name }}" --prerelease --repo "${{ github.repository }}"
      - name: Open tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Smoke test failed for ${{ github.event.release.tag_name }} (rolled back to pre-release)" \
            --body "The post-release smoke test failed for release ${{ github.event.release.tag_name }}.

          Release: ${{ github.event.release.html_url }}
          Smoke run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Rollback (mark as pre-release): ${{ steps.mark.outcome }}

          The release has been marked as a pre-release so it is no longer the latest release. Investigate the smoke failure, fix it, and cut a new release; do not re-publish this tag as a stable release."
