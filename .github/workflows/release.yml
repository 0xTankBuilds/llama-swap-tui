name: release

# Tag-driven releases: pushing a tag like v1.4.0 builds binaries for
# linux/darwin/windows (amd64/arm64) and publishes them as a GitHub release.
"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          # The release must be created with RELEASE_PAT, not the built-in
          # GITHUB_TOKEN: releases created by GITHUB_TOKEN do not trigger
          # other workflows, so smoke-release.yml (on release: published)
          # never ran for v1.0.0 or v1.0.1. A PAT-created release fires it.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
